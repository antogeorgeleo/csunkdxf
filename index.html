<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Countersink Hole DXF Generator</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Font: Inter (modern, clean) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <header>
    <h1>Countersink Hole DXF Generator</h1>
    <p>Design & Export Countersink Hole Geometry (DXF Format)</p>
  </header>

  <main>
    <!-- Input Card -->
    <div class="card input-card">
      <div class="form-grid">
        <div class="form-group">
          <label for="od">Outer Diameter (OD):</label>
          <input
            id="od"
            type="number"
            value="12"
            step="0.1"
            min="0.1"
          /> mm
        </div>

        <div class="form-group">
          <label for="id">Inner Diameter (ID):</label>
          <input
            id="id"
            type="number"
            value="5"
            step="0.1"
            min="0.1"
          /> mm
        </div>

        <div class="form-group">
          <label for="angle">Countersink Angle:</label>
          <input
            id="angle"
            type="number"
            value="90"
            step="1"
            min="1"
            max="180"
          /> °
        </div>

        <div class="form-group">
          <label for="thk">Material Thickness:</label>
          <input
            id="thk"
            type="number"
            value="20"
            step="0.1"
            min="0.1"
          /> mm
        </div>
      </div>

      <button class="primary-btn" onclick="generateDXF()">
        Generate DXF
      </button>
    </div>

    <!-- Preview Card -->
    <div class="card preview-card">
      <h2>Geometry Preview</h2>
      <div class="preview-container">
        <div class="view-box">
          <canvas id="topView" width="240" height="240"></canvas>
          <p>Top View</p>
        </div>
        <div class="view-box">
          <canvas id="sideView" width="320" height="280"></canvas>
          <p>Side View</p>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
